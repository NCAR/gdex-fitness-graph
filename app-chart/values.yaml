# The app keeps its state in per-user JSON files guarded by node-local flocks,
# so it must run as exactly one replica (hence no replicaCount value).

webapp:
  name: gdex-fitness-graph
  group: gdex-fitness-graph
  path: /
  tls:
    fqdn: data-card.k8s.ucar.edu
    secretName: incommon-cert-gdex-fitness-graph
  container:
    image: hub.k8s.ucar.edu/riley_gdex_test/gdex-fitness-graph:v44180048574
    port: 8080
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
    responseTimeout: 60
    maxUploadSize: 10m
  ingress:
    ingressClassName: nginx-internal
  # Writable data directory (emptyDir). The init container clones the data repo
  # into <mountPath>/repo; every save is committed and pushed, so GitHub is the
  # durable store and a restarted pod simply re-clones.
  data:
    mountPath: /data
    sizeLimit: 100Mi
  # GitHub repo holding users/<name>.json (needs an initial commit on its default
  # branch). existingSecret: Secret with key `token`, a fine-grained PAT with
  # Contents read/write on that repo only.
  dataRepo:
    url: https://github.com/NCAR/gdex-fitness-graph-data.git
    existingSecret: gdex-fitness-graph-git
  # Optional: name of an existing Secret holding DJANGO_SECRET_KEY under the key
  # `secret-key`. Empty uses the app's built-in prototype key.
  secretKey:
    existingSecret: ""
