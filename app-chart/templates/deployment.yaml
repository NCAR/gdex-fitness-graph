apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  # Single writer: the per-user JSON file locks are not shared across pods.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
      - name: data
        emptyDir:
          sizeLimit: {{ .Values.webapp.data.sizeLimit }}
      initContainers:
      # Clone the data repo (one JSON file per user) onto the empty data volume.
      - name: clone-data
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: Always
        command:
        - sh
        - -ec
        - |
          if [ ! -d "$DATA_DIR/repo/.git" ]; then
            git clone "$DATA_REPO_URL" "$DATA_DIR/repo"
          fi
          mkdir -p "$DATA_DIR/repo/users"
        env:
        - name: DATA_DIR
          value: {{ .Values.webapp.data.mountPath }}
        - name: DATA_REPO_URL
          value: {{ required "webapp.dataRepo.url is required" .Values.webapp.dataRepo.url | quote }}
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ required "webapp.dataRepo.existingSecret is required" .Values.webapp.dataRepo.existingSecret }}
              key: token
        volumeMounts:
        - name: data
          mountPath: {{ .Values.webapp.data.mountPath }}
      containers:
      - name: {{ .Values.webapp.name }}
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: Always
        resources:
          requests:
            memory: {{ .Values.webapp.container.requests.memory }}
            cpu: {{ .Values.webapp.container.requests.cpu }}
          limits:
            memory: {{ .Values.webapp.container.limits.memory }}
            cpu: {{ .Values.webapp.container.limits.cpu }}
        ports:
        - containerPort: {{ .Values.webapp.container.port }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.webapp.container.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.webapp.tls.fqdn }}
          initialDelaySeconds: 5
        env:
        - name: DJANGO_DEBUG
          value: "0"
        - name: DJANGO_ALLOWED_HOSTS
          value: {{ .Values.webapp.tls.fqdn | quote }}
        - name: DJANGO_CSRF_TRUSTED_ORIGINS
          value: {{ printf "https://%s" .Values.webapp.tls.fqdn | quote }}
        - name: FITNESS_USERS_DIR
          value: {{ .Values.webapp.data.mountPath }}/repo/users
        - name: FITNESS_GIT_SYNC
          value: "1"
        - name: FITNESS_GIT_REPO
          value: {{ .Values.webapp.data.mountPath }}/repo
        - name: GIT_TOKEN
          valueFrom:
            secretKeyRef:
              name: {{ .Values.webapp.dataRepo.existingSecret }}
              key: token
        {{- if .Values.webapp.secretKey.existingSecret }}
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.webapp.secretKey.existingSecret }}
              key: secret-key
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.webapp.data.mountPath }}
