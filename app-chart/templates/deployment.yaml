apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Values.webapp.name }}
    group: {{ .Values.webapp.group }}
spec:
  # Single writer: the JSON file lock is not shared across pods.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Values.webapp.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
      - name: data
        emptyDir:
          sizeLimit: {{ .Values.webapp.data.sizeLimit }}
      initContainers:
      # Seed the empty data volume with the example graph.
      - name: seed-data
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: Always
        command:
        - cp
        - /app/data/{{ .Values.webapp.data.fileName }}
        - {{ .Values.webapp.data.mountPath }}/{{ .Values.webapp.data.fileName }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.webapp.data.mountPath }}
      containers:
      - name: {{ .Values.webapp.name }}
        image: {{ .Values.webapp.container.image }}
        imagePullPolicy: Always
        resources:
          requests:
            memory: {{ .Values.webapp.container.requests.memory }}
            cpu: {{ .Values.webapp.container.requests.cpu }}
          limits:
            memory: {{ .Values.webapp.container.limits.memory }}
            cpu: {{ .Values.webapp.container.limits.cpu }}
        ports:
        - containerPort: {{ .Values.webapp.container.port }}
        readinessProbe:
          httpGet:
            path: /
            port: {{ .Values.webapp.container.port }}
            httpHeaders:
            - name: Host
              value: {{ .Values.webapp.tls.fqdn }}
          initialDelaySeconds: 5
        env:
        - name: DJANGO_DEBUG
          value: "0"
        - name: DJANGO_ALLOWED_HOSTS
          value: {{ .Values.webapp.tls.fqdn | quote }}
        - name: DJANGO_CSRF_TRUSTED_ORIGINS
          value: {{ printf "https://%s" .Values.webapp.tls.fqdn | quote }}
        - name: FITNESS_GRAPH_PATH
          value: {{ .Values.webapp.data.mountPath }}/{{ .Values.webapp.data.fileName }}
        {{- if .Values.webapp.secretKey.existingSecret }}
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Values.webapp.secretKey.existingSecret }}
              key: secret-key
        {{- end }}
        volumeMounts:
        - name: data
          mountPath: {{ .Values.webapp.data.mountPath }}
